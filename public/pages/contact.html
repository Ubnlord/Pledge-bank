<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact — PLEDGE BANK</title><link rel="stylesheet" href="../assets/css/main.css"><link rel="icon" href="../assets/images/logo.svg"><script src="../assets/js/main.js" defer></script></head><body><header class="site-header"><a class="brand" href="../index.html"><img src="../assets/images/logo.svg" alt=""><span>PLEDGE<span class="brand-light">BANK</span></span></a><div class="header-actions"><a href="../index.html">Home</a></div></header><main class="page-shell"><form class="form-card" data-demo-form><div class="eyebrow"><span class="eyebrow-line"></span> Customer support</div><h1>How can we help?</h1><p>Send a message to the Pledge Bank team. This contact form is currently a non-submitting preview.</p><label class="form-field">Your name<input name="name" required placeholder="Your name"></label><label class="form-field">Email address<input name="email" type="email" required placeholder="you@example.com"></label><label class="form-field">What can we help with?<select name="topic"><option>General question</option><option>Website feedback</option><option>Account opening</option><option>Security concern</option></select></label><label class="form-field">Message<textarea name="message" rows="4" required placeholder="Tell us a little more..."></textarea></label><button class="button button-dark" type="submit">Send message <span>↗</span></button><div class="form-status" role="status" aria-live="polite" data-form-status></div></form></main></body></html>
