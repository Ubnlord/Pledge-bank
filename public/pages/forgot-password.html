<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#082f2b"><title>Reset password — PLEDGE BANK</title><link rel="icon" href="../assets/images/logo.svg" type="image/svg+xml"><style>:root{--deep:#082f2b;--ink:#173a32;--muted:#71827a;--line:#e5ebe4;--bg:#f4f7f2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,sans-serif}.header{height:76px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,5vw,70px)}.brand{display:flex;align-items:center;gap:10px;font-weight:850;font-size:16px;color:var(--deep);text-decoration:none}.brand img{width:38px;height:38px}.brand-light{color:#6e9e43;font-weight:500}.header>a:not(.brand){font-size:12px;font-weight:750;color:var(--deep);text-decoration:none}.wrap{min-height:calc(100vh - 76px);display:grid;place-items:center;padding:30px 16px}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:clamp(24px,5vw,42px);width:min(100%,460px);box-shadow:0 16px 50px #0b30200b}.eyebrow{font-size:10px;letter-spacing:.15em;font-weight:850;color:#66845c;text-transform:uppercase}.eyebrow:before{content:"";display:inline-block;width:22px;height:2px;background:#91b65f;vertical-align:middle;margin-right:8px}h1{font-size:clamp(26px,5vw,34px);letter-spacing:-1.1px;line-height:1.2;margin:12px 0}p{font-size:12px;color:var(--muted);margin:0 0 24px}.field{display:block;font-size:11px;font-weight:750;margin:15px 0 0}.field input{display:block;width:100%;margin-top:7px;border:1px solid #dce5db;border-radius:9px;padding:13px 12px;font:inherit;font-size:13px;color:var(--ink);background:#fff;outline:none}.field input:focus{border-color:#719c54;box-shadow:0 0 0 3px #91b65f20}.btn{display:block;width:100%;border:0;border-radius:9px;background:var(--deep);color:white;font-weight:800;font-size:12px;padding:14px;margin-top:22px;cursor:pointer}.btn:disabled{opacity:.65;cursor:wait}.links{display:flex;justify-content:space-between;gap:12px;margin-top:17px;font-size:11px}.links a{color:#37634b;text-decoration:none;font-weight:750}.status{display:none;border-radius:9px;padding:12px 13px;margin-top:16px;font-size:11px;overflow-wrap:anywhere}.status.show{display:block}.status.error{background:#fff0ef;border:1px solid #f1d3d0;color:#963b35}.status.success{background:#eaf4e5;border:1px solid #d5e7cb;color:#315f31}</style></head><body><header class="header"><a class="brand" href="../index.html"><img src="../assets/images/logo.svg" alt=""><span>PLEDGE<span class="brand-light">BANK</span></span></a><a href="login.html">Back to sign in</a></header><main class="wrap"><section class="panel"><div class="eyebrow">Account recovery</div><h1>Reset your password.</h1><p>We'll send a password recovery link to the email address on your account.</p><form id="reset-form"><label class="field">Email address<input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></label><button class="btn" id="submit" type="submit">Send recovery email ↗</button></form><div id="status" class="status" role="status" aria-live="polite"></div><div class="links"><a href="login.html">Return to sign in</a></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(()=>{const client=window.supabase?.createClient('https://iilxerppufschjdcsayn.supabase.co','sb_publishable_1DukkDEInEm4vJyZ38SbtA_l6V5um6O');const form=document.getElementById('reset-form'),btn=document.getElementById('submit'),box=document.getElementById('status');function message(t,e=false){box.textContent=t;box.className='status show '+(e?'error':'success')}if(!client){message('Secure recovery could not load. Check your connection and reload.',true);return}form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;btn.textContent='Sending…';try{const {error}=await client.auth.resetPasswordForEmail(document.getElementById('email').value.trim(),{redirectTo:location.origin+location.pathname.replace(/forgot-password\.html$/,'reset-password.html')});if(error)throw error;message('If this email is registered, a recovery link will arrive shortly. Follow the link to choose a new password.')}catch(err){message(err.message||'Could not send the recovery email. Please try again.',true)}finally{btn.disabled=false;btn.textContent='Send recovery email ↗'}})})();</script></body></html>
